<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lift?</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; width: 100vw; height: 100vh; }

/* ── ROADSIDE IMAGE LAYER ──────────────────────────────────────── */
#roadside-layer {
  position: fixed; inset: 0; z-index: 1;
  transition: opacity 1.4s ease;
}
#roadside-img {
  width: 100%; height: 100%; object-fit: cover; object-position: center;
  display: block;
}

/* Hidden clickable zone at the roadside figure location */
#trigger-zone {
  position: fixed;
  /* Character is at ~63% from left, ~64% from top — small target */
  left: 80%; top: 61%;
  width: 9%; height: 12%;
  z-index: 5;
  cursor: pointer;
  /* Uncomment to debug: background: rgba(255,0,0,0.3); */
}

/* ── THREE.JS CANVAS (character scene) ────────────────────────── */
#canvas {
  position: fixed; inset: 0;
  display: block; width: 100%; height: 100%;
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 2;
}
#canvas.visible { opacity: 1; }

/* ── SCANLINES ─────────────────────────────────────────────────── */
#scanlines {
  position: fixed; inset: 0; z-index: 6; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  opacity: 0; transition: opacity 0.8s;
}
#scanlines.visible { opacity: 0.4; }

/* ── DIALOGUE SYSTEM (Kitchen style) ──────────────────────────── */
#dialogue-overlay {
  position: fixed; inset: 0; z-index: 30;
  cursor: pointer; display: none;
}
#dialogue-box {
  position: fixed; bottom: 0; left: 0; width: 100%;
  padding: 20px 24px 24px;
  background: linear-gradient(to top, rgba(0,5,15,0.97) 0%, rgba(0,5,15,0.85) 80%, transparent 100%);
  pointer-events: none;
}
#speaker-name {
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 8px; transition: color 0.3s;
  font-family: 'Courier New', monospace;
}
#dialogue-text {
  font-size: clamp(14px, 3.5vw, 18px); line-height: 1.7;
  color: #e8f8ff; min-height: 2.5em;
  text-shadow: 0 0 8px rgba(0,238,255,0.3);
  font-family: 'Courier New', monospace;
}
#dialogue-hint {
  font-size: 10px; color: rgba(0,238,255,0.4);
  letter-spacing: 2px; margin-top: 12px;
  text-align: right; text-transform: uppercase;
  animation: blink 1.4s infinite;
  font-family: 'Courier New', monospace;
}
@keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }

/* ── MASTER FADE OVERLAY ───────────────────────────────────────── */
#fade-overlay {
  position: fixed; inset: 0; background: #000;
  opacity: 0; pointer-events: none;
  z-index: 50; transition: opacity 1s ease;
}
#fade-overlay.fading { opacity: 1; }
</style>
</head>
<body>

<!-- Roadside image — the only thing visible on load -->
<div id="roadside-layer">
  <img id="roadside-img" src="https://raw.githubusercontent.com/Muntasir-UwU/Birthday/main/lift.png" alt="Roadside"/>
</div>

<!-- Hidden trigger at the figure's position -->
<div id="trigger-zone"></div>

<!-- Three.js canvas — invisible until triggered -->
<canvas id="canvas"></canvas>

<!-- Scanlines effect -->
<div id="scanlines"></div>

<!-- Kitchen-style dialogue overlay -->
<div id="dialogue-overlay">
  <div id="dialogue-box">
    <div id="speaker-name"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-hint">tap anywhere to continue</div>
  </div>
</div>

<!-- Master fade -->
<div id="fade-overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const CHAPTER3_URL = 'https://muntasir-uwu.github.io/Birthday/the-birthday-ride.html';

// ─── FLOW STATE ──────────────────────────────────────────────────────────────
const flow = {
  triggered: false,
  dialogueActive: false,
  dialogueIndex: 0,
  interactionLocked: false,
};

// ─── DIALOGUE LINES (roadside story) ─────────────────────────────────────────
const DIALOGUE = [
  { speaker: 'narrator', text: 'The countryside road was almost empty.' },
  { speaker: 'narrator', text: 'Only six hours remained before midnight.' },
  { speaker: 'narrator', text: 'He had one goal.' },
  { speaker: 'narrator', text: "Reach town before his wife's birthday began." },
  { speaker: 'narrator', text: 'The birthday cake was waiting at a supermarket.' },
  { speaker: 'narrator', text: 'But town was far away.' },
  { speaker: 'male',     text: "If I don't get there in time..." },
  { speaker: 'male',     text: 'The surprise will be ruined.' },
  { speaker: 'narrator', text: 'A few cars passed by.' },
  { speaker: 'narrator', text: 'None of them stopped.' },
  { speaker: 'male',     text: 'Just one ride.' },
  { speaker: 'male',     text: "That's all I need." },
  { speaker: 'narrator', text: 'A faint light appeared in the distance.' },
  { speaker: 'narrator', text: 'At first it looked like another star.' },
  { speaker: 'narrator', text: 'But instead of going faster its speed is becoming slower.' },
  { speaker: 'male',     text: 'Please...' },
  { speaker: 'male',     text: 'Let this be the one.' },
  { speaker: 'narrator', text: 'The sound of an engine echoed through the darkness.' },
  { speaker: 'narrator', text: 'The approaching light reflected off the road.' },
  { speaker: 'narrator', text: 'For a brief moment...' },
  { speaker: 'narrator', text: 'It felt like fate had finally answered.' },
  { speaker: 'narrator', text: '...' },
  { speaker: 'narrator', text: '...' },
];

// ─── THREE.JS SETUP ──────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x00000a);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x00000a, 0.025);

// Camera — Kitchen-style perspective
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(16, 16, 10);
camera.lookAt(0, 0, -1);

const camTarget = {
  pos:        new THREE.Vector3(16, 16, 10),
  look:       new THREE.Vector3(0, 0, -1),
  posDefault: new THREE.Vector3(16, 16, 10),
  lookDefault:new THREE.Vector3(0, 0, -1),
};
const tmpVec = new THREE.Vector3();

function focusCamera(pos, look) { camTarget.pos.copy(pos); camTarget.look.copy(look); }
function resetCamera()          { camTarget.pos.copy(camTarget.posDefault); camTarget.look.copy(camTarget.lookDefault); }

// ─── PARTICLES ────────────────────────────────────────────────────────────────
const particleGeo = new THREE.BufferGeometry();
const particleCount = 300;
const ppos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  ppos[i*3]   = (Math.random() - 0.5) * 24;
  ppos[i*3+1] = Math.random() * 12;
  ppos[i*3+2] = (Math.random() - 0.5) * 20;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(ppos, 3));
const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
  color: 0x003366, size: 0.05, transparent: true, opacity: 0.6,
}));
scene.add(particles);

// ─── BUILD MALE CHARACTER (exact Kitchen Conversation code) ──────────────────
function wireMat(color, opacity = 1) {
  return new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: opacity < 1, opacity });
}

function buildHuman(color, x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  const mat = wireMat(color, 1.0);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), mat.clone());
  head.position.set(0, 1.85, 0); g.add(head);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.18, 6), mat.clone());
  neck.position.set(0, 1.62, 0); g.add(neck);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.3), mat.clone());
  torso.position.set(0, 1.18, 0); g.add(torso);

  const hips = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.3, 0.28), mat.clone());
  hips.position.set(0, 0.78, 0); g.add(hips);

  for (let s of [-1, 1]) {
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.55, 6), mat.clone());
    upper.position.set(s * 0.14, 0.47, 0); g.add(upper);
    const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.5, 6), mat.clone());
    lower.position.set(s * 0.14, 0.12, 0); g.add(lower);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.22), mat.clone());
    foot.position.set(s * 0.14, -0.15, 0.05); g.add(foot);
  }

  for (let s of [-1, 1]) {
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.07, 0.5, 6), mat.clone());
    upper.position.set(s * 0.38, 1.15, 0); upper.rotation.z = s * 0.25; g.add(upper);
    const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.06, 0.45, 6), mat.clone());
    lower.position.set(s * 0.5, 0.82, 0); lower.rotation.z = s * 0.3; g.add(lower);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), mat.clone());
    hand.position.set(s * 0.6, 0.62, 0); g.add(hand);
  }

  const meshes = [];
  g.traverse(c => { if (c.isMesh) meshes.push(c); });
  return { group: g, meshes, mat };
}

// Place male character at Kitchen Conversation position
const maleData = buildHuman(0xff4422, -2.2, 0, 0.5);
scene.add(maleData.group);
maleData.group.rotation.y = Math.PI * 0.15;

// Start invisible — will fade in when triggered
maleData.meshes.forEach(m => {
  m.material.transparent = true;
  m.material.opacity = 0;
});

// Point light on character (also invisible initially)
const charLight = new THREE.PointLight(0xff4422, 0, 6);
charLight.position.set(-2.2, 2, 2);
scene.add(charLight);

// ─── CHARACTER FADE HELPERS ───────────────────────────────────────────────────
let charOpacity = 0;
let charOpacityTarget = 0;

function setCharVisible(on) {
  charOpacityTarget = on ? 1 : 0;
}

// ─── RENDER LOOP ─────────────────────────────────────────────────────────────
const lerpSpeed = 0.04;
let animT = 0;

function animateScene() {
  requestAnimationFrame(animateScene);
  animT += 0.02;

  // Character idle sway (Kitchen style)
  maleData.group.position.y = Math.sin(animT * 0.8) * 0.025;
  maleData.group.rotation.y = Math.PI * 0.15 + Math.sin(animT * 0.3) * 0.03;

  // Smooth character opacity
  if (charOpacity !== charOpacityTarget) {
    charOpacity += (charOpacityTarget - charOpacity) * 0.04;
    if (Math.abs(charOpacity - charOpacityTarget) < 0.005) charOpacity = charOpacityTarget;
    maleData.meshes.forEach(m => { m.material.opacity = charOpacity; });
    charLight.intensity = charOpacity * 2.5;
  }

  // Particles drift up
  const pos = particles.geometry.attributes.position;
  for (let i = 0; i < particleCount; i++) {
    pos.array[i*3+1] += 0.002;
    if (pos.array[i*3+1] > 12) pos.array[i*3+1] = 0;
  }
  pos.needsUpdate = true;

  // Camera lerp (Kitchen style)
  camera.position.lerp(camTarget.pos, lerpSpeed);
  tmpVec.lerp(camTarget.look, lerpSpeed * 1.5);
  camera.lookAt(tmpVec);

  renderer.render(scene, camera);
}
tmpVec.copy(camTarget.look);
animateScene();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── TRIGGER SEQUENCE ────────────────────────────────────────────────────────
// Step 1: user clicks trigger zone → fade out roadside image
// Step 2: fade in Three.js scene + character
// Step 3: camera zooms to character (Kitchen style)
// Step 4: after camera settles, start dialogue

function triggerScene() {
  if (flow.triggered || flow.interactionLocked) return;
  flow.triggered = true;
  flow.interactionLocked = true;

  // Fade out the roadside image
  const roadsideLayer = document.getElementById('roadside-layer');
  roadsideLayer.style.opacity = '0';

  // After image is gone, show Three.js canvas + scanlines
  setTimeout(() => {
    canvas.classList.add('visible');
    document.getElementById('scanlines').classList.add('visible');

    // Fade character in
    setCharVisible(true);

    // Camera: start wide then zoom to character (Kitchen dialogue style)
    // First frame: look at male character position
    camTarget.pos.copy(camTarget.posDefault);
    camTarget.look.set(-2.2, 1, 0.5);

    // After 800ms, zoom in with Kitchen camera
    setTimeout(() => {
      focusCamera(new THREE.Vector3(3, 5.5, 6), new THREE.Vector3(-2, 1.2, 0.5));

      // After camera settles (1200ms), start dialogue
      setTimeout(() => {
        flow.interactionLocked = false;
        beginDialogue();
      }, 1400);
    }, 800);

  }, 1000); // wait for roadside image to fade out
}

document.getElementById('trigger-zone').addEventListener('click', triggerScene);
document.getElementById('trigger-zone').addEventListener('touchend', e => {
  e.preventDefault(); triggerScene();
}, { passive: false });

// ─── DIALOGUE SYSTEM (Kitchen style, exact) ──────────────────────────────────
const dialogueOverlay = document.getElementById('dialogue-overlay');
const speakerNameEl   = document.getElementById('speaker-name');
const dialogueTextEl  = document.getElementById('dialogue-text');

let typewriterTimer = null, currentFullText = '', typewriterDone = false;

function beginDialogue() {
  flow.dialogueActive = true;
  flow.interactionLocked = true;
  flow.dialogueIndex = 0;
  dialogueOverlay.style.display = 'block';
  showDialogueLine(0);
}

function showDialogueLine(idx) {
  if (idx >= DIALOGUE.length) { endDialogue(); return; }

  const line = DIALOGUE[idx];
  const isMale = line.speaker === 'male';
  const isNarrator = line.speaker === 'narrator';

  // Speaker label styling
  if (isNarrator) {
    speakerNameEl.textContent = 'NARRATOR';
    speakerNameEl.style.color = '#aad4ff';
  } else {
    speakerNameEl.textContent = 'HIM';
    speakerNameEl.style.color = '#ff7755';
  }

  // Kitchen camera shift per speaker
  if (isMale) {
    focusCamera(new THREE.Vector3(3, 5.5, 6), new THREE.Vector3(-2, 1.2, 0.5));
  } else {
    focusCamera(new THREE.Vector3(5, 6, 7), new THREE.Vector3(-1, 1, 0.5));
  }

  // Typewriter effect (Kitchen style)
  clearInterval(typewriterTimer);
  dialogueTextEl.textContent = '';
  currentFullText = line.text;
  typewriterDone = false;
  let i = 0;
  typewriterTimer = setInterval(() => {
    i++;
    dialogueTextEl.textContent = currentFullText.slice(0, i);
    if (i >= currentFullText.length) {
      clearInterval(typewriterTimer);
      typewriterDone = true;
    }
  }, 30);
}

function advanceDialogue() {
  if (!flow.dialogueActive) return;
  if (!typewriterDone) {
    clearInterval(typewriterTimer);
    dialogueTextEl.textContent = currentFullText;
    typewriterDone = true;
    return;
  }
  flow.dialogueIndex++;
  if (flow.dialogueIndex >= DIALOGUE.length) { endDialogue(); return; }
  showDialogueLine(flow.dialogueIndex);
}

function endDialogue() {
  flow.dialogueActive = false;
  flow.interactionLocked = true;

  // 1. Fade out dialogue box
  dialogueOverlay.style.opacity = '0';
  dialogueOverlay.style.transition = 'opacity 0.6s ease';

  // 2. Fade out character
  setTimeout(() => {
    dialogueOverlay.style.display = 'none';
    setCharVisible(false);
  }, 600);

  // 3. Fade entire screen to black
  setTimeout(() => {
    const fadeEl = document.getElementById('fade-overlay');
    fadeEl.classList.add('fading');
  }, 1400);

  // 4. Redirect
  setTimeout(() => {
    window.location.href = CHAPTER3_URL;
  }, 2600);
}

// Tap/click to advance dialogue
dialogueOverlay.addEventListener('click', advanceDialogue);
dialogueOverlay.addEventListener('touchend', e => {
  e.preventDefault(); advanceDialogue();
}, { passive: false });
</script>
</body>
</html>
