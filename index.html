<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Birthday case</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Bebas+Neue&family=Montserrat:wght@100;200;300;400&display=swap');

  *, *::before, *::after {
    margin: 0; padding: 0;
    box-sizing: border-box;
  }

  :root {
    --black: #000000;
    --white: #ffffff;
    --white-dim: rgba(255,255,255,0.6);
    --white-faint: rgba(255,255,255,0.15);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    overflow: hidden;
    cursor: none;
  }

  /* ─── CUSTOM CURSOR ─────────────────────────── */
  .cursor {
    position: fixed;
    width: 6px; height: 6px;
    background: var(--white);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, opacity 0.3s ease;
    mix-blend-mode: difference;
  }

  /* ─── SCREEN BASE ────────────────────────────── */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--black);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1);
    z-index: 10;
  }

  .screen.active {
    opacity: 1;
    pointer-events: all;
  }

  /* ─── GRAIN OVERLAY ─────────────────────────── */
  .grain {
    position: fixed;
    inset: -50%;
    width: 200%; height: 200%;
    pointer-events: none;
    z-index: 100;
    opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    animation: grain-shift 0.12s steps(1) infinite;
  }

  @keyframes grain-shift {
    0%   { transform: translate(0,0); }
    10%  { transform: translate(-3%,-2%); }
    20%  { transform: translate(2%,3%); }
    30%  { transform: translate(-1%,2%); }
    40%  { transform: translate(3%,-1%); }
    50%  { transform: translate(-2%,1%); }
    60%  { transform: translate(1%,-3%); }
    70%  { transform: translate(-3%,2%); }
    80%  { transform: translate(2%,-2%); }
    90%  { transform: translate(-1%,3%); }
    100% { transform: translate(0,0); }
  }

  /* ─── VIGNETTE ──────────────────────────────── */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.85) 100%);
  }

  /* ══════════════════════════════════════════════
     SCREEN 1 — LOADING
  ══════════════════════════════════════════════ */
  #screen-loading {
    gap: 40px;
    z-index: 20;
  }

  .loading-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: clamp(11px, 1.4vw, 13px);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--white);
    height: 1.4em;
    overflow: hidden;
  }

  .loading-label span {
    display: inline-block;
  }

  /* typewriter cursor blink */
  .tw-cursor {
    display: inline-block;
    width: 1px;
    height: 1em;
    background: var(--white);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.75s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* progress bar */
  .progress-track {
    width: clamp(160px, 28vw, 320px);
    height: 1px;
    background: rgba(255,255,255,0.12);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--white);
    position: absolute;
    top: 0; left: 0;
    transition: width 0.05s linear;
    box-shadow: 0 0 8px rgba(255,255,255,0.6);
  }

  .progress-percent {
    font-family: 'Montserrat', sans-serif;
    font-weight: 100;
    font-size: clamp(9px, 1vw, 10px);
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.35);
    margin-top: 18px;
    font-variant-numeric: tabular-nums;
  }

  /* ══════════════════════════════════════════════
     SCREEN 2 — HEADPHONE
  ══════════════════════════════════════════════ */
  #screen-headphone {
    gap: 0;
    z-index: 20;
  }

  .headphone-icon-wrap {
    opacity: 0;
    transform: scale(0.88) translateY(10px);
    animation: none;
    transition: opacity 0.9s cubic-bezier(0.4,0,0.2,1), transform 0.9s cubic-bezier(0.4,0,0.2,1);
    margin-bottom: 44px;
  }

  .headphone-icon-wrap.reveal {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .headphone-svg {
    width: clamp(72px, 12vw, 110px);
    height: clamp(72px, 12vw, 110px);
    fill: none;
    stroke: var(--white);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.15));
  }

  /* SVG stroke draw animation */
  .headphone-svg .draw {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: stroke-draw 1.6s cubic-bezier(0.4,0,0.2,1) forwards;
  }

  @keyframes stroke-draw {
    to { stroke-dashoffset: 0; }
  }

  .headphone-text {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: clamp(10px, 1.3vw, 12px);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--white-dim);
    text-align: center;
    line-height: 1.9;
    height: 3em;
    padding: 0 20px;
  }

  /* ══════════════════════════════════════════════
     SCREEN 3 — WELCOME
  ══════════════════════════════════════════════ */
  #screen-welcome {
    gap: 0;
    z-index: 20;
    overflow: hidden;
  }

  .welcome-eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-weight: 100;
    font-size: clamp(9px, 1vw, 10px);
    letter-spacing: 0.7em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
  }

  .welcome-eyebrow.reveal { opacity: 1; transform: translateY(0); }

  .welcome-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 16vw, 180px);
    letter-spacing: 0.12em;
    color: var(--white);
    line-height: 0.9;
    text-align: center;
    height: 1em;
    overflow: hidden;
  }

  .welcome-heading-inner {
    display: block;
    transform: translateY(110%);
    transition: transform 1s cubic-bezier(0.16,1,0.3,1) 0.1s;
  }

  .welcome-heading-inner.reveal {
    transform: translateY(0);
  }

  /* divider line */
  .welcome-divider {
    width: 0;
    height: 1px;
    background: rgba(255,255,255,0.4);
    margin: 28px auto;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1) 0.4s;
  }

  .welcome-divider.reveal {
    width: clamp(60px, 10vw, 120px);
  }

  .welcome-sub {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(15px, 2.2vw, 22px);
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.55);
    text-align: center;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 1s ease 1.2s, transform 1s ease 1.2s;
    height: 1.6em;
    overflow: hidden;
  }

  .welcome-sub.reveal {
    opacity: 1;
    transform: translateY(0);
  }

  /* ─── AMBIENT PARTICLES ─────────────────────── */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .particles.show { opacity: 1; }

  .particle {
    position: absolute;
    width: 1px; height: 1px;
    background: white;
    border-radius: 50%;
    animation: particle-float linear infinite;
  }

  @keyframes particle-float {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.4; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(-110vh) translateX(var(--drift)); opacity: 0; }
  }

  /* ─── FLASH TRANSITION ──────────────────────── */
  .flash {
    position: fixed;
    inset: 0;
    background: var(--black);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .flash.show { opacity: 1; }
  .flash.hide { opacity: 0; }

  /* ─── CINEMATIC BARS ────────────────────────── */
  .cinematic-bar {
    position: fixed;
    left: 0; right: 0;
    height: 0;
    background: var(--black);
    z-index: 60;
    transition: height 1.4s cubic-bezier(0.4,0,0.2,1);
  }

  .bar-top    { top: 0; }
  .bar-bottom { bottom: 0; }
  .cinematic-bar.open { height: clamp(28px, 5vh, 56px); }
  .interactive-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    border: none;
    outline: none;
    padding: 20px;
    transition: opacity 0.5s ease;
  }
</style>
</head>
<body>

<!-- Cursor -->
<div class="cursor" id="cursor"></div>

<!-- Grain & Vignette -->
<div class="grain"></div>
<div class="vignette"></div>

<!-- Cinematic bars -->
<div class="cinematic-bar bar-top"    id="bar-top"></div>
<div class="cinematic-bar bar-bottom" id="bar-bottom"></div>

<!-- Flash overlay -->
<div class="flash" id="flash"></div>

<!-- Particles -->
<canvas class="particles" id="particles"></canvas>

<!-- ══ SCREEN 1 — LOADING ══ -->
<div class="screen" id="screen-loading">
  <div class="loading-label">
    <span id="loading-text"></span><span class="tw-cursor" id="loading-cursor"></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="progress-percent" id="progress-percent">0%</div>
</div>

<!-- ══ SCREEN 2 — HEADPHONE ══ -->
<div class="screen" id="screen-headphone">
  <div class="headphone-icon-wrap" id="hp-wrap">
    <svg class="headphone-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- arc -->
      <path class="draw" d="M18 52 C18 28 82 28 82 52"/>
      <!-- left cup -->
      <rect class="draw" x="10" y="50" width="16" height="26" rx="8"/>
      <!-- right cup -->
      <rect class="draw" x="74" y="50" width="16" height="26" rx="8"/>
      <!-- left band connector -->
      <line class="draw" x1="18" y1="64" x2="18" y2="52"/>
      <!-- right band connector -->
      <line class="draw" x1="82" y1="64" x2="82" y2="52"/>
    </svg>
  </div>
  <div class="headphone-text" id="hp-text"></div>
</div>

<!-- ══ SCREEN 3 — WELCOME ══ -->
<div class="screen" id="screen-welcome">
  <div class="welcome-eyebrow" id="wc-eyebrow">A Story Begins</div>
  <h1 class="welcome-heading">
    <span class="welcome-heading-inner" id="wc-heading">Welcome</span>
  </h1>
  <div class="welcome-divider" id="wc-divider"></div>
  <p class="welcome-sub" id="wc-sub">Tanisha To The Case</p>
  <button class="interactive-screen" id="gate-button"></button>
</div>


<script>
/* ─────────────────────────────────────────────
   CURSOR
───────────────────────────────────────────── */
const cursor = document.getElementById('cursor');
let mx = -100, my = -100;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px';
  cursor.style.top  = my + 'px';
});

/* ─────────────────────────────────────────────
   PARTICLES (canvas)
───────────────────────────────────────────── */
(function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function mkParticle() {
    return {
      x: Math.random() * W,
      y: H + 10,
      size: Math.random() * 1.2 + 0.2,
      speed: Math.random() * 0.35 + 0.1,
      drift: (Math.random() - 0.5) * 0.3,
      opacity: 0,
      maxOpacity: Math.random() * 0.35 + 0.05,
      life: 0,
      maxLife: Math.random() * 600 + 300
    };
  }

  for (let i = 0; i < 55; i++) {
    const p = mkParticle();
    p.y = Math.random() * H;
    p.life = Math.random() * p.maxLife;
    particles.push(p);
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach((p, i) => {
      p.y -= p.speed;
      p.x += p.drift;
      p.life++;

      const progress = p.life / p.maxLife;
      if (progress < 0.1) p.opacity = (progress / 0.1) * p.maxOpacity;
      else if (progress > 0.85) p.opacity = ((1 - progress) / 0.15) * p.maxOpacity;
      else p.opacity = p.maxOpacity;

      if (p.life >= p.maxLife || p.y < -5) particles[i] = mkParticle();

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ─────────────────────────────────────────────
   UTILITY
───────────────────────────────────────────── */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function flashTransition(cb) {
  const f = document.getElementById('flash');
  f.classList.add('show');
  setTimeout(() => {
    cb();
    f.classList.remove('show');
  }, 420);
}

async function typewrite(el, text, speed = 65) {
  el.textContent = '';
  for (const ch of text) {
    el.textContent += ch;
    await sleep(speed);
  }
}

/* ─────────────────────────────────────────────
   SCREEN 1 — LOADING
───────────────────────────────────────────── */
async function runLoading() {
  showScreen('screen-loading');
  await sleep(300);

  const label  = document.getElementById('loading-text');
  const bar    = document.getElementById('progress-fill');
  const pct    = document.getElementById('progress-percent');

  // typewrite "Loading..."
  await typewrite(label, 'Loading...', 70);
  document.getElementById('loading-cursor').style.display = 'none';

  await sleep(200);

  // animate progress
  await new Promise(resolve => {
    let val = 0;
    const target = 100;
    const duration = 2600;
    const start = performance.now();

    // eased progress
    function easeInOutCubic(t) {
      return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    }

    function step(now) {
      const elapsed = now - start;
      const raw = Math.min(elapsed / duration, 1);
      const eased = easeInOutCubic(raw);
      val = Math.round(eased * target);

      bar.style.width = val + '%';
      pct.textContent = val + '%';

      if (raw < 1) requestAnimationFrame(step);
      else {
        bar.style.width = '100%';
        pct.textContent = '100%';
        resolve();
      }
    }
    requestAnimationFrame(step);
  });

  await sleep(500);
}

/* ─────────────────────────────────────────────
   SCREEN 2 — HEADPHONE
───────────────────────────────────────────── */
async function runHeadphone() {
  flashTransition(() => showScreen('screen-headphone'));
  await sleep(600);

  // open cinematic bars
  document.getElementById('bar-top').classList.add('open');
  document.getElementById('bar-bottom').classList.add('open');

  // reveal icon with stroke draw
  const wrap = document.getElementById('hp-wrap');
  wrap.classList.add('reveal');
  // restart animations on SVG paths
  const paths = wrap.querySelectorAll('.draw');
  paths.forEach((p, i) => {
    p.style.animation = 'none';
    p.getBoundingClientRect();
    p.style.animation = `stroke-draw ${1.4 + i * 0.12}s cubic-bezier(0.4,0,0.2,1) ${0.1 + i * 0.08}s forwards`;
  });

  await sleep(900);

  // typewrite headphone text
  const hpText = document.getElementById('hp-text');
  await typewrite(hpText, 'Use Headphones', 55);
  await typewrite(hpText, hpText.textContent + '\nFor The Best Experience', 48);

  await sleep(3000);
}

/* ─────────────────────────────────────────────
   SCREEN 3 — WELCOME
───────────────────────────────────────────── */
async function runWelcome() {
  flashTransition(() => {
    showScreen('screen-welcome');
    document.getElementById('particles').classList.add('show');
  });

  await sleep(500);

  // eyebrow
  document.getElementById('wc-eyebrow').classList.add('reveal');
  await sleep(400);

  // heading slide up
  document.getElementById('wc-heading').classList.add('reveal');
  await sleep(600);

  // divider expand
  document.getElementById('wc-divider').classList.add('reveal');
  await sleep(1200);

  // subtitle fade
  document.getElementById('wc-sub').classList.add('reveal');
}

/* ─────────────────────────────────────────────
   MAIN SEQUENCE
───────────────────────────────────────────── */
(async function main() {
  await sleep(120);
  await runLoading();
  await runHeadphone();
  await runWelcome();
})();
  const button = document.getElementById('gate-button');

    function advanceToNextAct() {
      // Fade out the content visually
      button.style.opacity = '0';
      
      // Redirect cleanly after the quick transition fade finishes
      setTimeout(() => {
        window.location.href = 'https://muntasir-uwu.github.io/Birthday/inki.html';
      }, 500);
    }

    // Capture standard clicks and mobile screen taps
    button.addEventListener('click', advanceToNextAct);
</script>
</body>
</html>
