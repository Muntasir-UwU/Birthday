<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>THE BIRTHDAY RIDE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: manipulation;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 9/16;
    max-height: 100vh;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: manipulation;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  #fadeLayer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 10;
  }
  #dialogueBox {
    pointer-events: all;
    background: rgba(0,0,0,0.88);
    border-top: 2px solid #00aaff;
    padding: 14px 16px 10px;
    min-height: 130px;
    cursor: pointer;
    position: relative;
    z-index: 5;
  }
  #speakerName {
    color: #ff2d78;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
    min-height: 16px;
  }
  #dialogueText {
    color: #fff;
    font-size: 13px;
    line-height: 1.7;
    min-height: 60px;
  }
  #tapHint {
    color: #00aaff;
    font-size: 9px;
    letter-spacing: 2px;
    text-align: right;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #tapHint.visible { opacity: 1; }
  #choiceContainer {
    pointer-events: all;
    padding: 8px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 5;
    background: rgba(0,0,0,0.88);
    border-top: 1px solid #222;
  }
  .choiceBtn {
    background: transparent;
    border: 1px solid #00aaff;
    color: #fff;
    padding: 10px 14px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    letter-spacing: 0.5px;
    transition: background 0.2s, color 0.2s;
    line-height: 1.5;
  }
  .choiceBtn:hover, .choiceBtn:active {
    background: #00aaff22;
    color: #00aaff;
  }
  #titleScreen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
    z-index: 20;
    gap: 0;
  }
  #titleScreen h1 {
    color: #ff2d78;
    font-size: 22px;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.3;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    margin-bottom: 8px;
  }
  #titleScreen .subtitle {
    color: #00aaff;
    font-size: 9px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  #titleScreen .startPrompt {
    color: #ffffff66;
    font-size: 10px;
    letter-spacing: 3px;
    animation: blink 1.4s infinite;
  }
  #titleScreen .saveInfo {
    position: absolute;
    bottom: 16px;
    color: #ffffff33;
    font-size: 9px;
    letter-spacing: 2px;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  #endScreen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 30;
    gap: 10px;
  }
  #endScreen .endText {
    color: #ff2d78;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    opacity: 0;
    transition: opacity 1.5s;
  }
  #endScreen .endSub {
    color: #00aaff44;
    font-size: 8px;
    letter-spacing: 3px;
    font-family: 'Courier New', monospace;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 1.5s 0.5s;
  }
  #sceneLabel {
    position: absolute;
    top: 10px;
    left: 0; right: 0;
    text-align: center;
    color: #00aaff55;
    font-size: 8px;
    letter-spacing: 4px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 4;
  }
  #menuBtn {
    position: absolute;
    top: 10px;
    right: 12px;
    color: #ffffff33;
    font-size: 9px;
    letter-spacing: 2px;
    cursor: pointer;
    pointer-events: all;
    z-index: 15;
    background: none;
    border: none;
    font-family: 'Courier New', monospace;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="fadeLayer"></div>
  <div id="sceneLabel" id="sceneLabel"></div>
  <div id="overlay">
    <div id="choiceContainer" style="display:none;"></div>
    <div id="dialogueBox" style="display:none;">
      <div id="speakerName"></div>
      <div id="dialogueText"></div>
      <div id="tapHint">TAP TO CONTINUE ▼</div>
    </div>
    <button id="menuBtn">≡ MENU</button>
  </div>
  <div id="titleScreen">
    <div style="color:#00aaff44;font-size:8px;letter-spacing:4px;margin-bottom:40px;font-family:'Courier New',monospace;">A DETECTIVE STORY</div>
    <h1>THE<br>BIRTHDAY<br>RIDE</h1>
    <div class="subtitle">— Chapter One —</div>
    <div class="startPrompt">TAP TO BEGIN</div>
    <div class="saveInfo" id="saveInfo"></div>
  </div>
  <div id="endScreen">
    <div class="endText" id="endText">INVESTIGATION CONTINUES...</div>
    <div class="endSub" id="endSub">— TO BE CONTINUED —</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 854;
canvas.width = W; canvas.height = H;

// ─── PALETTE ─────────────────────────────────────────────────────────────────
const C = {
  bg:      '#000000',
  road:    '#0a0a1a',
  roadLine:'#00aaff',
  env:     '#00aaff',
  envDim:  '#004488',
  envGlow: '#0066cc',
  pink:    '#ff2d78',
  pinkDim: '#881133',
  white:   '#ffffff',
  grey:    '#333344',
  greyMid: '#222233',
  yellow:  '#ffcc00',
  red:     '#ff3300',
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  scene: 'highway',
  dialogueIndex: 0,
  choiceMade: null,
  theory: null,
};

function saveGame() {
  localStorage.setItem('tbr_save', JSON.stringify({
    scene: state.scene,
    dialogueIndex: state.dialogueIndex,
    theory: state.theory,
  }));
}
function loadGame() {
  const s = localStorage.getItem('tbr_save');
  if (s) { const d = JSON.parse(s); state.scene = d.scene; state.dialogueIndex = d.dialogueIndex; state.theory = d.theory; return true; }
  return false;
}

// ─── FADE ─────────────────────────────────────────────────────────────────────
const fadeLayer = document.getElementById('fadeLayer');
function fadeOut(cb) {
  fadeLayer.style.opacity = '1';
  setTimeout(() => { if(cb) cb(); }, 650);
}
function fadeIn(cb) {
  fadeLayer.style.opacity = '0';
  setTimeout(() => { if(cb) cb(); }, 650);
}
function crossFade(cb) {
  fadeOut(() => { if(cb) cb(); setTimeout(() => fadeIn(), 100); });
}

// ─── DIALOGUE ENGINE ──────────────────────────────────────────────────────────
const dialogueBox = document.getElementById('dialogueBox');
const speakerEl   = document.getElementById('speakerName');
const textEl      = document.getElementById('dialogueText');
const tapHint     = document.getElementById('tapHint');
const choiceCont  = document.getElementById('choiceContainer');
const sceneLabel  = document.getElementById('sceneLabel');

let typing = false, typingTimer = null, currentLine = '';
let dialogueCallback = null;

function typeText(text, speed=28) {
  textEl.textContent = '';
  currentLine = text;
  typing = true;
  tapHint.classList.remove('visible');
  let i = 0;
  clearInterval(typingTimer);
  typingTimer = setInterval(() => {
    if (i < text.length) { textEl.textContent += text[i++]; }
    else { clearInterval(typingTimer); typing = false; tapHint.classList.add('visible'); }
  }, speed);
}

function showDialogue(speaker, text, cb) {
  choiceCont.style.display = 'none';
  dialogueBox.style.display = 'block';
  speakerEl.textContent = speaker || '';
  speakerEl.style.color = speaker ? C.pink : C.env;
  dialogueCallback = cb || null;
  typeText(text);
}

function showChoices(prompt, choices, cb) {
  choiceCont.innerHTML = '';
  dialogueBox.style.display = 'block';
  speakerEl.textContent = '';
  textEl.textContent = prompt;
  tapHint.classList.remove('visible');
  typing = false;
  choices.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'choiceBtn';
    btn.textContent = ch.label;
    btn.onclick = () => {
      choiceCont.style.display = 'none';
      cb(i, ch);
    };
    choiceCont.appendChild(btn);
  });
  choiceCont.style.display = 'flex';
}

function hideDialogue() {
  dialogueBox.style.display = 'none';
  choiceCont.style.display = 'none';
  tapHint.classList.remove('visible');
}

dialogueBox.addEventListener('click', () => {
  if (typing) {
    clearInterval(typingTimer);
    textEl.textContent = currentLine;
    typing = false;
    tapHint.classList.add('visible');
    return;
  }
  if (dialogueCallback) {
    const cb = dialogueCallback;
    dialogueCallback = null;
    tapHint.classList.remove('visible');
    cb();
  }
});

// ─── SCENE RENDERER ──────────────────────────────────────────────────────────
function drawSky(nightCity = false) {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  // Stars
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 60; i++) {
    const x = (i * 137.5) % W;
    const y = (i * 53.3) % (H * 0.45);
    const s = (i % 3 === 0) ? 1.5 : 0.8;
    ctx.globalAlpha = 0.3 + (i % 5) * 0.1;
    ctx.fillRect(x, y, s, s);
  }
  ctx.globalAlpha = 1;
  if (nightCity) {
    // City silhouette
    ctx.fillStyle = C.envDim;
    const buildings = [[30,180,60,120],[100,200,50,80],[160,160,70,140],[230,190,55,110],[290,170,65,130],[360,200,50,90],[420,180,60,120]];
    buildings.forEach(([x,y,w,h]) => {
      ctx.fillRect(x, y, w, h);
      // windows
      ctx.fillStyle = '#00aaff22';
      for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) {
        if (Math.random() > 0.4) ctx.fillRect(x+8+c*16, y+8+r*20, 8, 12);
      }
      ctx.fillStyle = C.envDim;
    });
  }
}

function drawRoad(perspective = true) {
  // Road surface
  ctx.fillStyle = '#060612';
  ctx.fillRect(0, H*0.38, W, H*0.62);
  // Road edges & center lines with perspective
  if (perspective) {
    const vx = W/2, vy = H*0.38;
    // Left shoulder
    ctx.strokeStyle = C.env;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(40, H); ctx.stroke();
    // Right shoulder
    ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(W-40, H); ctx.stroke();
    // Center dashes
    ctx.strokeStyle = C.envDim;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([20, 18]);
    ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);
    // Lane lines
    ctx.strokeStyle = C.envDim;
    ctx.lineWidth = 1;
    ctx.setLineDash([15,22]);
    ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(vx - 80, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(vx + 80, H); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle = C.env;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(60, H*0.38); ctx.lineTo(60, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-60, H*0.38); ctx.lineTo(W-60, H); ctx.stroke();
    ctx.strokeStyle = C.envDim;
    ctx.setLineDash([25,20]);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W/2, H*0.38); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// Human figure (stick figure style)
function drawHuman(x, y, scale=1, color=C.pink, lying=false, detective=false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  if (lying) {
    // Head
    ctx.beginPath(); ctx.arc(0, -4, 7, 0, Math.PI*2); ctx.fill();
    // Body
    ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(36, -4); ctx.stroke();
    // Arms
    ctx.beginPath(); ctx.moveTo(18, -4); ctx.lineTo(18, -16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(24, -4); ctx.lineTo(24, 6); ctx.stroke();
    // Legs
    ctx.beginPath(); ctx.moveTo(36, -4); ctx.lineTo(44, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(36, -4); ctx.lineTo(44, 4); ctx.stroke();
  } else {
    // Head
    ctx.beginPath(); ctx.arc(0, -38, 7, 0, Math.PI*2); ctx.fill();
    // Hat (detective)
    if (detective) {
      ctx.fillStyle = C.envGlow;
      ctx.fillRect(-9, -49, 18, 5);
      ctx.fillRect(-7, -58, 14, 10);
      ctx.fillStyle = color;
    }
    // Body
    ctx.beginPath(); ctx.moveTo(0, -31); ctx.lineTo(0, -6); ctx.stroke();
    // Arms
    ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(-12, -14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(12, -14); ctx.stroke();
    // Legs
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-8, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(8, 12); ctx.stroke();
  }
  ctx.restore();
}

// Car drawing
function drawCar(x, y, scale=1, color=C.envDim, facing='right') {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * (facing==='left'?-1:1), scale);
  // Shadow
  ctx.fillStyle = '#00000088';
  ctx.fillRect(-52, 8, 104, 10);
  // Body
  ctx.fillStyle = color;
  ctx.fillRect(-50, -12, 100, 22);
  // Roof
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-30, -12); ctx.lineTo(-20, -32); ctx.lineTo(22, -32); ctx.lineTo(32, -12);
  ctx.closePath(); ctx.fill();
  // Windows
  ctx.fillStyle = '#00aaff22';
  ctx.fillRect(-16, -30, 14, 16);
  ctx.fillRect(2, -30, 14, 16);
  // Wheels
  ctx.fillStyle = '#111';
  ctx.strokeStyle = C.env;
  ctx.lineWidth = 1.5;
  [-30, 28].forEach(wx => {
    ctx.beginPath(); ctx.arc(wx, 10, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(wx, 10, 4, 0, Math.PI*2); ctx.fillStyle = C.envDim; ctx.fill();
    ctx.fillStyle = '#111';
  });
  // Headlights
  ctx.fillStyle = '#ffff0044';
  ctx.fillRect(46, -6, 6, 10);
  // Taillights
  ctx.fillStyle = '#ff220066';
  ctx.fillRect(-52, -6, 6, 10);
  ctx.restore();
}

// Police car
function drawPoliceCar(x, y, scale=1) {
  drawCar(x, y, scale, '#001133');
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // Police stripe
  ctx.fillStyle = C.env;
  ctx.fillRect(-50, -4, 100, 3);
  // Light bar
  ctx.fillStyle = C.env;
  ctx.fillRect(-14, -36, 10, 5);
  ctx.fillStyle = C.pink;
  ctx.fillRect(4, -36, 10, 5);
  // Text
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 7px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('POLICE', 0, 6);
  ctx.restore();
}

// Stain
function drawStain(x, y, r=18) {
  ctx.save();
  ctx.globalAlpha = 0.75;
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, '#cc1100');
  g.addColorStop(1, '#33000000');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y, r, r*0.6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Cone / barrier
function drawCone(x, y) {
  ctx.fillStyle = '#ff8800';
  ctx.beginPath(); ctx.moveTo(x, y-20); ctx.lineTo(x-8, y); ctx.lineTo(x+8, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x-8, y-12, 16, 3);
}

// Crime tape
function drawTape(x1,y1,x2,y2) {
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 3;
  ctx.setLineDash([12,8]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.setLineDash([]);
}

// Tire tracks
function drawTireTracks(x, y, len=180) {
  ctx.strokeStyle = '#ffffff18';
  ctx.lineWidth = 6;
  ctx.setLineDash([20,15]);
  ctx.beginPath(); ctx.moveTo(x-14,y); ctx.lineTo(x-14,y+len); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+14,y); ctx.lineTo(x+14,y+len); ctx.stroke();
  ctx.setLineDash([]);
}

// CCTV camera
function drawCCTV(x, y) {
  ctx.fillStyle = C.env;
  ctx.fillRect(x-3, y-30, 4, 30);
  ctx.fillStyle = C.envGlow;
  ctx.fillRect(x-10, y-40, 20, 10);
  ctx.beginPath(); ctx.arc(x+12, y-35, 5, 0, Math.PI*2);
  ctx.fillStyle = C.pink; ctx.fill();
}

// Building / storefront
function drawBuilding(x, y, w, h, label='') {
  // Body
  ctx.fillStyle = C.greyMid;
  ctx.fillRect(x, y, w, h);
  // Outline
  ctx.strokeStyle = C.env;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h);
  // Windows
  ctx.fillStyle = '#00aaff18';
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    if ((r+c)%2===0) ctx.fillRect(x+10+c*((w-20)/3), y+16+r*24, (w-20)/3-4, 18);
  }
  // Sign
  if (label) {
    ctx.fillStyle = C.pink;
    ctx.fillRect(x+8, y+h-30, w-16, 22);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(10,w/10)}px Courier New`;
    ctx.textAlign = 'center';
    ctx.fillText(label, x+w/2, y+h-14);
  }
}

// Street lamp
function drawLamp(x, y) {
  ctx.strokeStyle = C.envDim;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y-70); ctx.lineTo(x+20, y-70); ctx.stroke();
  ctx.fillStyle = '#ffff8844';
  ctx.beginPath(); ctx.arc(x+20, y-64, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffff88';
  ctx.beginPath(); ctx.arc(x+20, y-64, 3, 0, Math.PI*2); ctx.fill();
  // Light cone
  ctx.save();
  ctx.globalAlpha = 0.07;
  const g = ctx.createRadialGradient(x+20,y-64,0,x+20,y-64,90);
  g.addColorStop(0,'#ffff88'); g.addColorStop(1,'transparent');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x+20,y-64,90,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1; ctx.restore();
}

// ID card
function drawIDCard(x, y) {
  ctx.fillStyle = '#111122';
  ctx.strokeStyle = C.pink;
  ctx.lineWidth = 1.5;
  ctx.fillRect(x, y, 90, 60);
  ctx.strokeRect(x, y, 90, 60);
  ctx.fillStyle = C.pink;
  ctx.font = 'bold 7px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('NATIONAL ID', x+6, y+14);
  ctx.fillStyle = '#fff';
  ctx.font = '6px Courier New';
  ctx.fillText('Name: ████████', x+6, y+28);
  ctx.fillText('Address: Magura', x+6, y+40);
  ctx.fillText('DOB: ██/██/████', x+6, y+52);
}

// Cake box
function drawCake(x, y, scale=1) {
  ctx.save();
  ctx.translate(x,y); ctx.scale(scale,scale);
  // Box
  ctx.fillStyle = '#fff8ee';
  ctx.strokeStyle = C.pink;
  ctx.lineWidth = 2;
  ctx.fillRect(-22,-15,44,30);
  ctx.strokeRect(-22,-15,44,30);
  // Ribbon
  ctx.strokeStyle = C.pink;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(0,15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-22,-2); ctx.lineTo(22,-2); ctx.stroke();
  // Bow
  ctx.fillStyle = C.pink;
  ctx.beginPath(); ctx.arc(-6,-15,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6,-15,5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ─── SCENES ───────────────────────────────────────────────────────────────────
function drawSceneHighway() {
  drawSky(false);
  // Horizon glow
  const hg = ctx.createLinearGradient(0, H*0.3, 0, H*0.45);
  hg.addColorStop(0, '#00000000'); hg.addColorStop(1, '#00aaff11');
  ctx.fillStyle = hg; ctx.fillRect(0, H*0.3, W, H*0.15);
  drawRoad(true);
  // Lamps
  drawLamp(50, H*0.38);
  drawLamp(W-70, H*0.38);
  // Distant car

// ─── GAME LOOP ─────────────────────────────────────────────────────────────────
let currentSceneName = 'highway';
let animFrame;

function render() {
  renderScene(currentSceneName);
  animFrame = requestAnimationFrame(render);
}

function processNode(index) {
  if (index === null || index === undefined || index >= SCRIPT.length) return showEnd();
  state.dialogueIndex = index;
  saveGame();

  const node = SCRIPT[index];
  if (!node) return showEnd();

  if (node.type === 'end') return showEnd();

  if (node.scene && node.scene !== currentSceneName) {
    crossFade(() => {
      currentSceneName = node.scene;
      state.scene = node.scene;
      if (node.type === 'choice') {
        showChoices(node.prompt, node.choices, (i, ch) => {
          if (i === 0) state.theory = ch.label;
          processNode(ch.next);
        });
      } else {
        showDialogue(node.speaker, node.text, () => processNode(node.next));
      }
    });
    return;
  }

  if (node.type === 'choice') {
    showChoices(node.prompt, node.choices, (i, ch) => {
      if (i === 0 && !state.theory) state.theory = ch.label;
      processNode(ch.next);
    });
  } else {
    showDialogue(node.speaker, node.text, () => processNode(node.next));
  }
}

function showEnd() {
  hideDialogue();
  cancelAnimationFrame(animFrame);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  const endScreen = document.getElementById('endScreen');
  endScreen.style.display = 'flex';
  setTimeout(() => {
    document.getElementById('endText').style.opacity = '1';
    setTimeout(() => { document.getElementById('endSub').style.opacity = '1'; }, 600);
  }, 400);
  localStorage.removeItem('tbr_save');
}

// ─── MENU ─────────────────────────────────────────────────────────────────────
const menuBtn = document.getElementById('menuBtn');
menuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const menu = document.createElement('div');
  menu.style.cssText = `position:absolute;top:28px;right:12px;background:#000;border:1px solid #00aaff;
    padding:10px;z-index:50;font-family:'Courier New',monospace;font-size:11px;color:#fff;min-width:120px;`;
  ['Resume', 'Restart', 'Close'].forEach(label => {
    const item = document.createElement('div');
    item.textContent = label;
    item.style.cssText = 'padding:6px 10px;cursor:pointer;letter-spacing:2px;';
    item.onmouseenter = () => item.style.color = C.pink;
    item.onmouseleave = () => item.style.color = '#fff';
    item.onclick = () => {
      menu.remove();
      if (label === 'Resume') return;
      if (label === 'Restart') {
        localStorage.removeItem('tbr_save');
        location.reload();
      }
    };
    menu.appendChild(item);
  });
  document.getElementById('gameContainer').appendChild(menu);
  document.onclick = () => { menu.remove(); document.onclick = null; };
});

// Draw title background

})();

titleScreen.addEventListener('click', () => {
  crossFade(() => {
    titleScreen.style.display = 'none';
    render();
    const saved = loadGame();
    if (saved) {
      currentSceneName = state.scene || 'highway';
      processNode(state.dialogueIndex || 0);
    } else {
      processNode(0);
    }
  });
});

// End screen tap to restart
document.getElementById('endScreen').addEventListener('click', () => {

});
