<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>THE BIRTHDAY RIDE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Bebas+Neue&family=Montserrat:wght@100;200;300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #000000;
    --white: #ffffff;
    --white-dim: rgba(255,255,255,0.6);
    --white-faint: rgba(255,255,255,0.15);
    --white-ghost: rgba(255,255,255,0.08);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    overflow: hidden;
    cursor: none;
    font-family: 'Montserrat', sans-serif;
    touch-action: manipulation;
  }

  /* ─── CURSOR ────────────────────────────── */
  .cursor {
    position: fixed;
    width: 6px; height: 6px;
    background: var(--white);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%,-50%);
    transition: transform 0.1s ease, opacity 0.3s ease;
    mix-blend-mode: difference;
  }

  /* ─── GRAIN ─────────────────────────────── */
  .grain {
    position: fixed;
    inset: -50%;
    width: 200%; height: 200%;
    pointer-events: none;
    z-index: 100;
    opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    animation: grain-shift 0.12s steps(1) infinite;
  }
  @keyframes grain-shift {
    0%   { transform: translate(0,0); }
    10%  { transform: translate(-3%,-2%); }
    20%  { transform: translate(2%,3%); }
    30%  { transform: translate(-1%,2%); }
    40%  { transform: translate(3%,-1%); }
    50%  { transform: translate(-2%,1%); }
    60%  { transform: translate(1%,-3%); }
    70%  { transform: translate(-3%,2%); }
    80%  { transform: translate(2%,-2%); }
    90%  { transform: translate(-1%,3%); }
    100% { transform: translate(0,0); }
  }

  /* ─── VIGNETTE ──────────────────────────── */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.85) 100%);
  }

  /* ─── CINEMATIC BARS ────────────────────── */
  .cinematic-bar {
    position: fixed;
    left: 0; right: 0;
    height: clamp(28px,5vh,56px);
    background: var(--black);
    z-index: 60;
  }
  .bar-top    { top: 0; }
  .bar-bottom { bottom: 0; }

  /* ─── FLASH ─────────────────────────────── */
  .flash {
    position: fixed;
    inset: 0;
    background: var(--white);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .flash.show { opacity: 1; }

  /* ─── PARTICLES ─────────────────────────── */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .particles.show { opacity: 1; }

  /* ─── GAME CONTAINER ────────────────────── */
  #gameContainer {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 9/16;
    max-height: calc(100vh - clamp(56px,10vh,112px));
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ─── FADE LAYER ────────────────────────── */
  #fadeLayer {
    position: absolute;
    inset: 0;
    background: var(--black);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 10;
  }

  /* ─── SCENE LABEL ───────────────────────── */
  #sceneLabel {
    position: absolute;
    top: 12px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: clamp(7px, 1.2vw, 9px);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 4;
  }

  /* ─── OVERLAY ───────────────────────────── */
  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  /* ─── CHOICE CONTAINER ──────────────────── */
  #choiceContainer {
    pointer-events: all;
    padding: 12px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 5;
    background: linear-gradient(to top, rgba(0,0,0,0.97), rgba(0,0,0,0.7));
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .choiceBtn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--white-dim);
    padding: 11px 16px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: clamp(10px, 2.2vw, 12px);
    letter-spacing: 0.12em;
    cursor: pointer;
    text-align: left;
    line-height: 1.5;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .choiceBtn:hover, .choiceBtn:active {
    border-color: rgba(255,255,255,0.7);
    color: var(--white);
    background: rgba(255,255,255,0.04);
  }

  /* ─── DIALOGUE BOX ──────────────────────── */
  #dialogueBox {
    pointer-events: all;
    background: linear-gradient(to top, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.82) 100%);
    border-top: 1px solid rgba(255,255,255,0.12);
    padding: 16px 20px 14px;
    min-height: 130px;
    cursor: pointer;
    position: relative;
    z-index: 5;
  }

  #speakerName {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: clamp(8px, 1.4vw, 10px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 10px;
    min-height: 14px;
  }

  #dialogueText {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(14px, 3vw, 18px);
    line-height: 1.75;
    color: var(--white);
    min-height: 60px;
    letter-spacing: 0.02em;
  }

  #tapHint {
    font-family: 'Montserrat', sans-serif;
    font-weight: 100;
    font-size: clamp(7px, 1.2vw, 9px);
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.35em;
    text-align: right;
    margin-top: 10px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.4s;
    animation: tapblink 1.5s infinite;
  }
  #tapHint.visible { opacity: 1; }
  @keyframes tapblink { 0%,100%{opacity:0.25} 50%{opacity:0.6} }

  /* ─── MENU BTN ──────────────────────────── */
  #menuBtn {
    position: absolute;
    top: 12px; right: 14px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    color: rgba(255,255,255,0.2);
    font-size: clamp(7px,1.3vw,9px);
    letter-spacing: 0.3em;
    cursor: pointer;
    pointer-events: all;
    z-index: 15;
    background: none;
    border: none;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  #menuBtn:hover { color: rgba(255,255,255,0.7); }

  /* ─── TITLE SCREEN ──────────────────────── */
  #titleScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--black);
    cursor: pointer;
    z-index: 20;
    overflow: hidden;
  }

  .title-eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-weight: 100;
    font-size: clamp(7px,1.2vw,9px);
    letter-spacing: 0.65em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
  }
  .title-eyebrow.reveal { opacity: 1; transform: translateY(0); }

  #titleScreen h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px,18vw,96px);
    letter-spacing: 0.12em;
    color: var(--white);
    text-align: center;
    line-height: 0.95;
    height: 3em;
    overflow: hidden;
  }

  .title-line-wrap {
    display: block;
    overflow: hidden;
    height: 1em;
  }
  .title-line-inner {
    display: block;
    transform: translateY(110%);
    transition: transform 1s cubic-bezier(0.16,1,0.3,1);
  }
  .title-line-inner.reveal { transform: translateY(0); }

  .title-divider {
    width: 0;
    height: 1px;
    background: rgba(255,255,255,0.35);
    margin: 24px auto;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1) 0.6s;
  }
  .title-divider.reveal { width: clamp(50px,12vw,100px); }

  .title-sub {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(12px,2.5vw,16px);
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.45);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.9s ease 1.4s, transform 0.9s ease 1.4s;
    text-align: center;
  }
  .title-sub.reveal { opacity: 1; transform: translateY(0); }

  .title-start {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: clamp(8px,1.4vw,10px);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-top: 36px;
    opacity: 0;
    transition: opacity 0.8s ease 2.2s;
    animation: titleBlink 1.6s infinite 2.4s;
  }
  .title-start.reveal { opacity: 1; }
  @keyframes titleBlink { 0%,100%{opacity:0.3} 50%{opacity:0.7} }

  .title-save {
    position: absolute;
    bottom: 14px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 100;
    font-size: clamp(6px,1vw,8px);
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
  }

  /* ─── END SCREEN ────────────────────────── */
  #endScreen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--black);
    z-index: 30;
    gap: 12px;
  }

  .end-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(22px,6vw,36px);
    letter-spacing: 0.25em;
    color: var(--white);
    opacity: 0;
    transition: opacity 1.5s;
    text-align: center;
  }

  .end-divider {
    width: 0;
    height: 1px;
    background: rgba(255,255,255,0.3);
    margin: 0 auto;
    transition: width 1s ease 0.8s;
  }
  .end-divider.open { width: clamp(40px,10vw,80px); }

  .end-sub {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(11px,2vw,14px);
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.35);
    opacity: 0;
    transition: opacity 1.2s ease 0.6s;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Cursor -->
<div class="cursor" id="cursor"></div>

<!-- Atmosphere -->
<div class="grain"></div>
<div class="vignette"></div>
<div class="cinematic-bar bar-top"></div>
<div class="cinematic-bar bar-bottom"></div>
<div class="flash" id="flash"></div>
<canvas class="particles" id="bgParticles"></canvas>

<!-- Game -->
<div id="gameContainer">
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>
    <div id="fadeLayer"></div>
    <div id="sceneLabel"></div>
    <div id="overlay">
      <div id="choiceContainer" style="display:none;"></div>
      <div id="dialogueBox" style="display:none;">
        <div id="speakerName"></div>
        <div id="dialogueText"></div>
        <div id="tapHint">Continue</div>
      </div>
    </div>
    <button id="menuBtn">Menu</button>

    <!-- Title Screen -->
    <div id="titleScreen">
      <div class="title-eyebrow" id="t-eyebrow">A Detective Story</div>
      <h1>
        <span class="title-line-wrap"><span class="title-line-inner" id="tl1">THE</span></span>
        <span class="title-line-wrap"><span class="title-line-inner" id="tl2">BIRTHDAY</span></span>
        <span class="title-line-wrap"><span class="title-line-inner" id="tl3">RIDE</span></span>
      </h1>
      <div class="title-divider" id="t-divider"></div>
      <div class="title-sub" id="t-sub">Chapter One</div>
      <div class="title-start" id="t-start">Tap to Begin</div>
      <div class="title-save" id="saveInfo"></div>
    </div>

    <!-- End Screen -->
    <div id="endScreen">
      <div class="end-heading" id="endText">Do You know why the killer wasnt identified? </div>
      <div class="end-divider" id="endDivider"></div>
      <div class="end-sub" id="endSub">say on inbox.</div>
    </div>
  </div>
</div>

<script>
/* ─── CURSOR ───────────────────────────────────────────────── */
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
});

/* ─── BG PARTICLES ─────────────────────────────────────────── */
(function() {
  const cv = document.getElementById('bgParticles');
  const cx = cv.getContext('2d');
  let W, H, pts = [];
  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  function mkP() {
    return { x: Math.random()*W, y: H+5, size: Math.random()*1.1+0.2,
      speed: Math.random()*0.3+0.08, drift: (Math.random()-0.5)*0.25,
      opacity:0, maxOpacity: Math.random()*0.3+0.04,
      life:0, maxLife: Math.random()*600+300 };
  }
  for (let i=0;i<55;i++){const p=mkP();p.y=Math.random()*H;p.life=Math.random()*p.maxLife;pts.push(p);}
  function tick(){
    cx.clearRect(0,0,W,H);
    pts.forEach((p,i)=>{
      p.y-=p.speed; p.x+=p.drift; p.life++;
      const t=p.life/p.maxLife;
      if(t<0.1) p.opacity=(t/0.1)*p.maxOpacity;
      else if(t>0.85) p.opacity=((1-t)/0.15)*p.maxOpacity;
      else p.opacity=p.maxOpacity;
      if(p.life>=p.maxLife||p.y<-5) pts[i]=mkP();
      cx.beginPath(); cx.arc(p.x,p.y,p.size,0,Math.PI*2);
      cx.fillStyle=`rgba(255,255,255,${p.opacity})`; cx.fill();
    });
    requestAnimationFrame(tick);
  }
  tick();
  setTimeout(()=>{ document.getElementById('bgParticles').classList.add('show'); }, 800);
})();

/* ─── FLASH ────────────────────────────────────────────────── */
function flashTransition(cb) {
  const f = document.getElementById('flash');
  f.classList.add('show');
  setTimeout(()=>{ if(cb) cb(); f.classList.remove('show'); }, 420);
}

/* ─── GAME CANVAS ──────────────────────────────────────────── */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 854;
canvas.width = W; canvas.height = H;

/* ─── PALETTE (monochrome to match cinematic intro) ────────── */
const C = {
  bg:      '#000000',
  road:    '#080808',
  white:   '#ffffff',
  dim:     'rgba(255,255,255,0.55)',
  faint:   'rgba(255,255,255,0.15)',
  ghost:   'rgba(255,255,255,0.06)',
  grey:    'rgba(255,255,255,0.08)',
  greyMid: 'rgba(255,255,255,0.04)',
  accent:  'rgba(255,255,255,0.9)',
  red:     'rgba(255,255,255,0.35)', // stains are desaturated
};

/* ─── STATE ────────────────────────────────────────────────── */
let state = { scene:'highway', dialogueIndex:0, theory:null };
function saveGame() { localStorage.setItem('tbr_save', JSON.stringify({scene:state.scene,dialogueIndex:state.dialogueIndex,theory:state.theory})); }
function loadGame() { const s=localStorage.getItem('tbr_save'); if(s){const d=JSON.parse(s);state.scene=d.scene;state.dialogueIndex=d.dialogueIndex;state.theory=d.theory;return true;} return false; }

/* ─── FADE ─────────────────────────────────────────────────── */
const fadeLayer = document.getElementById('fadeLayer');
function fadeOut(cb) { fadeLayer.style.opacity='1'; setTimeout(()=>{if(cb)cb();},650); }
function fadeIn(cb)  { fadeLayer.style.opacity='0'; setTimeout(()=>{if(cb)cb();},650); }
function crossFade(cb) { fadeOut(()=>{ if(cb)cb(); setTimeout(()=>fadeIn(),100); }); }

/* ─── DIALOGUE ENGINE ──────────────────────────────────────── */
const dialogueBox = document.getElementById('dialogueBox');
const speakerEl   = document.getElementById('speakerName');
const textEl      = document.getElementById('dialogueText');
const tapHint     = document.getElementById('tapHint');
const choiceCont  = document.getElementById('choiceContainer');
const sceneLabel  = document.getElementById('sceneLabel');

let typing=false, typingTimer=null, currentLine='', dialogueCallback=null;

function typeText(text, speed=30) {
  textEl.textContent=''; currentLine=text; typing=true;
  tapHint.classList.remove('visible'); let i=0; clearInterval(typingTimer);
  typingTimer = setInterval(()=>{
    if(i<text.length){ textEl.textContent+=text[i++]; }
    else { clearInterval(typingTimer); typing=false; tapHint.classList.add('visible'); }
  }, speed);
}

function showDialogue(speaker, text, cb) {
  choiceCont.style.display='none'; dialogueBox.style.display='block';
  speakerEl.textContent = speaker || '';
  // All speakers use same subtle white; narrator lines italic
  if (!speaker) {
    speakerEl.textContent = '';
    textEl.style.fontStyle = 'italic';
    textEl.style.color = 'rgba(255,255,255,0.65)';
  } else {
    textEl.style.fontStyle = 'normal';
    textEl.style.color = 'rgba(255,255,255,1)';
  }
  dialogueCallback=cb||null; typeText(text);
}

function showChoices(prompt, choices, cb) {
  choiceCont.innerHTML=''; dialogueBox.style.display='block';
  speakerEl.textContent=''; textEl.textContent=prompt;
  textEl.style.fontStyle='italic'; textEl.style.color='rgba(255,255,255,0.6)';
  tapHint.classList.remove('visible'); typing=false;
  choices.forEach((ch,i)=>{
    const btn=document.createElement('button');
    btn.className='choiceBtn'; btn.textContent=ch.label;
    btn.onclick=()=>{ choiceCont.style.display='none'; cb(i,ch); };
    choiceCont.appendChild(btn);
  });
  choiceCont.style.display='flex';
}

function hideDialogue() {
  dialogueBox.style.display='none'; choiceCont.style.display='none';
  tapHint.classList.remove('visible');
}

dialogueBox.addEventListener('click', ()=>{
  if(typing){ clearInterval(typingTimer); textEl.textContent=currentLine; typing=false; tapHint.classList.add('visible'); return; }
  if(dialogueCallback){ const cb=dialogueCallback; dialogueCallback=null; tapHint.classList.remove('visible'); cb(); }
});

/* ─── DRAW HELPERS (monochrome) ────────────────────────────── */
function drawSky(nightCity=false) {
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  // Stars — white dots, very faint
  for(let i=0;i<70;i++){
    const x=(i*137.5)%W, y=(i*53.3)%(H*0.42);
    ctx.globalAlpha=0.08+(i%5)*0.06;
    ctx.fillStyle=C.white;
    ctx.fillRect(x,y,(i%3===0)?1.5:0.7,(i%3===0)?1.5:0.7);
  }
  ctx.globalAlpha=1;
  if(nightCity){
    // City silhouette — very dark
    ctx.fillStyle='rgba(255,255,255,0.04)';
    [[30,180,60,120],[100,200,50,80],[160,160,70,140],[230,190,55,110],[290,170,65,130],[360,200,50,90],[420,180,60,120]]
      .forEach(([x,y,w,h])=>{
        ctx.fillRect(x,y,w,h);
        ctx.fillStyle='rgba(255,255,255,0.03)';
        for(let r=0;r<5;r++) for(let c=0;c<3;c++)
          if(Math.random()>0.5) ctx.fillRect(x+8+c*16,y+8+r*20,8,12);
        ctx.fillStyle='rgba(255,255,255,0.04)';
      });
  }
}

function drawRoad(perspective=true) {
  ctx.fillStyle='rgba(255,255,255,0.035)'; ctx.fillRect(0,H*0.38,W,H*0.62);
  if(perspective){
    const vx=W/2, vy=H*0.38;
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(40,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(W-40,H); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
    ctx.setLineDash([20,18]);
    ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(W/2,H); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.setLineDash([15,22]);
    ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(vx-80,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(vx+80,H); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(60,H*0.38); ctx.lineTo(60,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-60,H*0.38); ctx.lineTo(W-60,H); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(8,-4); ctx.lineTo(36,-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18,-4); ctx.lineTo(18,-16); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(36,-4); ctx.lineTo(44,-12); ctx.stroke();

/* ─── GAME LOOP ────────────────────────────────────────────── */
let currentSceneName='highway', animFrame;
function render(){ renderScene(currentSceneName); animFrame=requestAnimationFrame(render); }

function processNode(index){
  if(index===null||index===undefined||index>=SCRIPT.length) return showEnd();
  state.dialogueIndex=index; saveGame();
  const node=SCRIPT[index]; if(!node) return showEnd();
  if(node.type==='end') return showEnd();
  if(node.scene&&node.scene!==currentSceneName){
    crossFade(()=>{
      currentSceneName=node.scene; state.scene=node.scene;
      if(node.type==='choice') showChoices(node.prompt,node.choices,(i,ch)=>{ if(i===0)state.theory=ch.label; processNode(ch.next); });
      else showDialogue(node.speaker,node.text,()=>processNode(node.next));
    }); return;
  }
  if(node.type==='choice') showChoices(node.prompt,node.choices,(i,ch)=>{ if(i===0&&!state.theory)state.theory=ch.label; processNode(ch.next); });
  else showDialogue(node.speaker,node.text,()=>processNode(node.next));
}

function showEnd(){
  hideDialogue(); cancelAnimationFrame(animFrame);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const endScreen=document.getElementById('endScreen');
  endScreen.style.display='flex';
  setTimeout(()=>{
    document.getElementById('endText').style.opacity='1';
    document.getElementById('endDivider').classList.add('open');
    setTimeout(()=>{ document.getElementById('endSub').style.opacity='1'; },600);
  },400);
  localStorage.removeItem('tbr_save');
}

  ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(W-40,H); ctx.stroke();
  drawPoliceCar(W/2,H*0.86,0.95);
  ctx.globalAlpha=0.3; drawHuman(W/2-10,H*0.72,0.7,0.5,true); ctx.globalAlpha=1;
})();

// Stagger title reveal
setTimeout(()=>document.getElementById('t-eyebrow').classList.add('reveal'),300);
setTimeout(()=>{ ['tl1','tl2','tl3'].forEach((id,i)=>setTimeout(()=>document.getElementById(id).classList.add('reveal'),i*180)); },600);
setTimeout(()=>document.getElementById('t-divider').classList.add('reveal'),900);
setTimeout(()=>document.getElementById('t-sub').classList.add('reveal'),1100);
setTimeout(()=>document.getElementById('t-start').classList.add('reveal'),1800);

titleScreen.addEventListener('click', ()=>{
  flashTransition(()=>{
    titleScreen.style.display='none';
    render();
    const saved=loadGame();
    if(saved){ currentSceneName=state.scene||'highway'; processNode(state.dialogueIndex||0); }
    else { processNode(0); }
  });
});

document.getElementById('endScreen').addEventListener('click',()=>{ localStorage.removeItem('tbr_save'); window.location.href='https://github.com/Muntasir-UwU/Birthday/blob/main/birthdaycake.html'; });
</script>
